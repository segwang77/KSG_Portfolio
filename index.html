<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="3D 클릭 휠 플레이어로 프로젝트를 탐색하는 KSG 개발 포트폴리오">
<meta property="og:title" content="김세광 개발 포트폴리오">
<meta property="og:description" content="3D 클릭 휠 플레이어로 프로젝트를 탐색하는 KSG 개발 포트폴리오">
<style>
/* 기본 리셋 (휴대폰 노치·홈 바 영역 여백 포함) */
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
</style>
<title>KSG Portfolio</title>
<!-- 파비콘: ksg_logo.png 파일을 index.html과 같은 폴더에 두세요 -->
<link rel="icon" type="image/png" href="ksg_logo.png">
<link rel="apple-touch-icon" href="ksg_logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: 플레이어 뷰 = 화면 전체에 3D 기기 하나. 리스트 뷰 = 탐색기(사이드바 | 파일 목록 | 미리보기) */
:root{
  --bg:#EDEFF2; --surface:#FFFFFF; --fg:#16191E; --muted:#5C6470; --line:#DADFE5; --line-soft:#EEF0F3;
  --hover:#F3F5F8; --sel:#E2EBFB; --accent:#2C67D8; --accent-ink:#FFFFFF; --folder:#E2AC38;
  --stage:#D8DCE2; --stage-hi:#F7F8FA;
  --dev-front:#F4F4F2; --dev-wheel:#E1E3E6; --dev-label:#8F96A0;
  /* 기기 화면(LCD)은 실물처럼 테마와 무관하게 한 가지 모습 */
  --lcd-bg:#FFFFFF; --lcd-fg:#15181D; --lcd-muted:#59616C; --lcd-line:#E2E5E9; --lcd-on:#FFFFFF;
  --lcd-sel1:#64A8F5; --lcd-sel2:#2361D1; --lcd-head1:#FBFBFC; --lcd-head2:#D3D8DE; --lcd-edge:#8D95A0; --lcd-lang:#E5EEFC;
  --display:"Familjen Grotesk","IBM Plex Sans KR",system-ui,sans-serif;
  --body:"IBM Plex Sans KR",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D0F12; --surface:#15181D; --fg:#E7EAEE; --muted:#8E96A0; --line:#272C33; --line-soft:#1D2127;
    --hover:#1B1F25; --sel:#1C2A45; --accent:#7AA2FF; --accent-ink:#0D0F12; --folder:#D3A13A;
    --stage:#0E1014; --stage-hi:#1E232B;
    --dev-front:#1C1D20; --dev-wheel:#2C2E33; --dev-label:#8A8F98; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D0F12; --surface:#15181D; --fg:#E7EAEE; --muted:#8E96A0; --line:#272C33; --line-soft:#1D2127;
  --hover:#1B1F25; --sel:#1C2A45; --accent:#7AA2FF; --accent-ink:#0D0F12; --folder:#D3A13A;
  --stage:#0E1014; --stage-hi:#1E232B;
  --dev-front:#1C1D20; --dev-wheel:#2C2E33; --dev-label:#8A8F98; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{height:100%}
body{min-height:100%;display:flex;flex-direction:column;padding-inline:16px;padding-block:16px 88px;-webkit-tap-highlight-color:transparent;
  color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.6;
  background:radial-gradient(120% 90% at 50% 42%,var(--stage-hi),var(--stage) 72%) var(--stage)}
body.v-list{background:var(--bg)}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.view{transition:opacity .26s ease,transform .34s cubic-bezier(.2,.7,.2,1)}
.view.leave{opacity:0;transform:scale(.96)}
.view.enter{opacity:0;transform:translateY(10px)}

/* ---------- player ---------- */
.site-head{display:flex;justify-content:center;padding-block:2px 6px}
.site-head h1{margin:0;font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:-.02em;line-height:1.2;color:var(--fg)}
#player{flex:1;position:relative;display:flex;flex-direction:column;gap:8px;min-height:520px}
#stage{flex:1;position:relative;outline:none;min-height:420px}
.howto-wrap{display:flex;flex-direction:column;align-items:center;gap:4px}
.howto-toggle{display:inline-flex;align-items:center;gap:4px;font:inherit;font-size:12px;color:var(--muted);background:transparent;border:0;padding:3px 10px;border-radius:999px;cursor:pointer}
.howto-toggle:hover{color:var(--fg);background:var(--hover)}
.howto-toggle svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s}
.howto-toggle[aria-expanded="false"] svg{transform:rotate(180deg)}
.howto{list-style:none;margin:0 auto;padding:0;max-width:720px;display:flex;flex-wrap:wrap;justify-content:center;gap:4px 16px;
  font-size:12.5px;line-height:1.6;color:var(--muted)}
.howto li{display:flex;align-items:center;gap:6px;white-space:nowrap}
.howto li span{color:var(--fg);font-weight:600}
.howto kbd{font-family:var(--mono);font-size:11px;padding:0 5px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;background:var(--surface);color:var(--fg)}
@media (hover:none){ .howto .kb{display:none} }
@media (max-width:600px){
  .howto{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 12px;max-width:360px;width:100%;font-size:12px}
  .howto li{white-space:normal}
  .howto .wide{grid-column:1/-1;justify-content:center}
}
@media (max-height:640px){ #player{min-height:440px} #stage{min-height:340px} }
#stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#stage .fallback{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:var(--muted)}
/* ---------- bottom dock ---------- */
.dock{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:10;
  display:flex;gap:2px;padding:5px;border-radius:999px;border:1px solid var(--line);
  background:color-mix(in srgb,var(--surface) 80%,transparent);backdrop-filter:blur(14px) saturate(1.3);-webkit-backdrop-filter:blur(14px) saturate(1.3);
  box-shadow:0 10px 30px -12px rgba(0,0,0,.28)}
.dock-ind{position:absolute;top:5px;bottom:5px;left:0;width:0;border-radius:999px;background:var(--fg);
  transition:transform .38s cubic-bezier(.2,.7,.2,1),width .38s cubic-bezier(.2,.7,.2,1)}
.dock button{all:unset;box-sizing:border-box;position:relative;z-index:1;display:flex;align-items:center;gap:7px;height:40px;padding:0 16px;
  border-radius:999px;font-size:13.5px;font-weight:500;color:var(--muted);cursor:pointer;white-space:nowrap;transition:color .25s}
.dock button:hover{color:var(--fg)}
.dock button[aria-current="true"]{color:var(--bg)}
.dock button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.dock button[hidden]{display:none}
.dock svg{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.dock button.icon-only{padding:0 12px}
.dock-sep{width:1px;margin:9px 3px;background:var(--line)}

/* ---------- explorer ---------- */
#list{width:100%;max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:14px;padding-block:4px 24px}
.toolbar{display:flex;align-items:center;gap:8px;padding:6px 6px 6px 6px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.icon-btn{width:34px;height:34px;flex:none;border-radius:8px;border:0;background:transparent;color:var(--fg);display:grid;place-items:center;cursor:pointer}
.icon-btn:hover:not(:disabled){background:var(--hover)}
.icon-btn:disabled{opacity:.35;cursor:default}
.icon-btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.crumbs{flex:1;min-width:0;display:flex;align-items:center;gap:2px;overflow-x:auto;scrollbar-width:none;font-size:14px}
.crumbs button{all:unset;padding:5px 8px;border-radius:6px;cursor:pointer;white-space:nowrap;color:var(--muted)}
.crumbs button:hover{background:var(--hover);color:var(--fg)}
.crumbs button[aria-current]{color:var(--fg);font-weight:600}
.crumbs button:focus-visible{outline:2px solid var(--accent)}
.crumbs .sep{color:var(--muted);opacity:.6}

.ex{display:grid;grid-template-columns:200px minmax(0,1fr) 330px;gap:14px;align-items:start}
.ex.no-preview{grid-template-columns:200px minmax(0,1fr)}
.side{display:flex;flex-direction:column;gap:2px;position:sticky;top:16px}
.side-h{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:6px 10px 8px}
.side-i{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;cursor:pointer;font-size:14px}
.side-i:hover{background:var(--hover)}
.side-i[aria-current="true"]{background:var(--sel);font-weight:600}
.side-i:focus-visible{outline:2px solid var(--accent)}
.side-i .count{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--muted);font-weight:400}

.ico{width:20px;height:20px;flex:none}
.ico.folder{fill:var(--folder)}
.ico.line{fill:none;stroke:var(--muted);stroke-width:1.7;stroke-linejoin:round;stroke-linecap:round}

.main{min-width:0;border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.thead,.row{display:grid;gap:16px;align-items:center;padding-inline:16px}
.cols-proj .thead,.cols-proj .row{grid-template-columns:minmax(0,2.2fr) minmax(0,1.7fr) 3.6em 3.6em}
.cols-folder .thead,.cols-folder .row{grid-template-columns:minmax(0,1fr) 5em 4em}
.cols-contact .thead,.cols-contact .row{grid-template-columns:minmax(0,.8fr) minmax(0,1.6fr) 5em}
.thead{height:38px;font-size:12px;font-weight:500;color:var(--muted);border-bottom:1px solid var(--line)}
.row{all:unset;box-sizing:border-box;display:grid;gap:16px;align-items:center;width:100%;min-height:54px;padding:8px 16px;border-bottom:1px solid var(--line-soft);cursor:default}
button.row{cursor:pointer}
button.row:hover{background:var(--hover)}
.row[aria-selected="true"]{background:var(--sel)}
button.row:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.name{display:flex;align-items:center;gap:12px;min-width:0}
.nm{display:flex;flex-direction:column;min-width:0;line-height:1.35}
.nm strong{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nm .sub{display:none;font-size:13.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell{font-size:14.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.c-stack{color:var(--fg)}
.num{font-family:var(--mono);font-size:13.5px;font-variant-numeric:tabular-nums}
.r{text-align:right;justify-self:end}
.thumb{width:32px;height:32px;flex:none;border-radius:6px;display:grid;place-items:center;color:#fff;font-family:var(--display);font-weight:700;font-size:13px;
  background:linear-gradient(135deg,hsl(var(--h) 72% 58%),hsl(calc(var(--h) + 38) 70% 28%))}
.eq{display:inline-flex;gap:2px;align-items:flex-end;height:12px;margin-left:auto;flex:none}
.eq i{width:3px;background:var(--accent);height:40%;animation:eq .9s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:-.3s}.eq i:nth-child(3){animation-delay:-.6s}
@keyframes eq{0%,100%{height:30%}50%{height:100%}}
.status{display:flex;justify-content:space-between;gap:12px;padding:10px 16px;font-size:12px;color:var(--muted);background:var(--surface)}
.status .pl{color:var(--accent);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini{font:inherit;font-size:12.5px;font-weight:500;padding:5px 12px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--fg);cursor:pointer;text-decoration:none;justify-self:end;white-space:nowrap}
.mini:hover{border-color:var(--muted)}
.val{font-family:var(--mono);font-size:13px;color:var(--fg);user-select:all}

.preview{position:sticky;top:16px;min-width:0;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:18px;display:flex;flex-direction:column;gap:14px}
.art{width:100%;max-width:100%;aspect-ratio:1/1;border-radius:10px;display:flex;align-items:flex-end;padding:14px 16px;color:#fff;
  font-family:var(--display);font-weight:700;font-size:64px;line-height:.9;letter-spacing:-.03em;
  background:repeating-radial-gradient(circle at 72% 30%,rgba(255,255,255,.13) 0 1.5px,transparent 1.5px 18px),linear-gradient(135deg,hsl(var(--h) 72% 58%),hsl(calc(var(--h) + 38) 70% 26%))}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.preview h2,.doc h2{font-family:var(--display);font-weight:700;font-size:28px;line-height:1.05;letter-spacing:-.02em;margin:4px 0 0;text-wrap:balance}
.preview p{margin:0;font-size:16px;line-height:1.7}
.meta{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:0;padding-block:12px;border-block:1px solid var(--line-soft)}
.meta div{display:flex;flex-direction:column;min-width:0}
.meta dt{font-size:11.5px;color:var(--muted)}
.meta dd{margin:0;font-size:15px;font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.ti{width:16px;height:16px;flex:none;vertical-align:-3px}
.chip{display:inline-flex;align-items:center;gap:6px}
.langs{display:flex;align-items:center;gap:4px 12px;overflow:hidden}
.nm .sub.langs{flex-wrap:wrap}
.tl{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.name > .ti{width:20px;height:20px}
#lcd .chip .ti{width:18px;height:18px}
#lcd .lcd-row > .ti{width:24px;height:24px}
.chip-groups{display:flex;flex-direction:column;gap:12px}
.chip-group{display:flex;flex-direction:column;gap:6px}
.chip-label{font-size:12px;color:var(--muted)}
.chip.lang{background:var(--sel);border-color:transparent;font-weight:600;color:var(--fg)}
.chip{font-family:var(--mono);font-size:13.5px;padding:4px 11px;border-radius:999px;border:1px solid var(--line)}
.actions{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
.primary{font:inherit;font-size:14px;font-weight:600;padding:9px 16px;border-radius:999px;border:0;background:var(--accent);color:var(--accent-ink);cursor:pointer}
.actions a{font-size:13.5px;text-decoration:none;border-bottom:1px solid var(--line)}
.actions a:hover{border-color:var(--fg)}
.file-note{font-family:var(--mono);font-size:13px;color:var(--muted)}
#lcd .file-note{font-size:15px;color:var(--lcd-muted)}

.doc{padding:28px clamp(18px,4vw,40px) 32px;display:flex;flex-direction:column;gap:14px}
.doc p{margin:0;max-width:62ch;font-size:16px;line-height:1.75}
.doc .meta{max-width:520px;margin-top:6px}
.cf{display:flex;flex-direction:column;gap:14px;max-width:620px;margin-top:4px}
.cf-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.cf label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
.cf input,.cf textarea{font:inherit;font-size:15px;font-weight:400;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 13px;width:100%;min-width:0}
.cf textarea{resize:vertical;min-height:150px;line-height:1.6}
.cf input:focus,.cf textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.cf-foot{display:flex;align-items:center;flex-wrap:wrap;gap:10px 16px}
.cf-send{font:inherit;font-size:15px;font-weight:600;padding:11px 22px;border-radius:999px;border:0;background:var(--accent);color:var(--accent-ink);cursor:pointer}
.cf-send:disabled{opacity:.6;cursor:default}
.cf-status{margin:0;font-size:14px;color:var(--muted)}
.cf-status.ok{color:#1E8E4E}
.cf-status.err{color:#C93A2E}
.cf-hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
#lcd .cf label{color:var(--lcd-muted);font-size:15px}
#lcd .cf input,#lcd .cf textarea{font-size:17px;color:var(--lcd-fg);background:var(--lcd-bg);border-color:var(--lcd-line)}
#lcd .cf input:focus,#lcd .cf textarea:focus{outline-color:var(--lcd-sel2)}
#lcd .cf-send{background:linear-gradient(var(--lcd-sel1),var(--lcd-sel2));color:var(--lcd-on);font-size:17px;padding:13px 26px}
#lcd .cf-status{font-size:15px;color:var(--lcd-muted)}
#lcd .lcd-doc p{font-size:18px}
@media (max-width:600px){ .cf-row{grid-template-columns:minmax(0,1fr)} }

/* ---------- full-screen LCD ---------- */
#lcd{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;color-scheme:light;
  background:var(--lcd-bg);color:var(--lcd-fg);font-family:var(--body);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  clip-path:inset(0px 0px 0px 0px round 0px);transition:clip-path .42s cubic-bezier(.2,.7,.2,1)}
.lcd-head{flex:none;height:58px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding-inline:12px;
  background:linear-gradient(var(--lcd-head1),var(--lcd-head2));border-bottom:2px solid var(--lcd-edge)}
.lcd-head .r{display:flex;justify-content:flex-end;gap:4px}
.lcd-title{font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:50vw}
.lcd-title.toast{color:var(--lcd-sel2)}
.lcd-ib{width:42px;height:42px;border-radius:9px;border:0;background:transparent;color:var(--lcd-fg);display:grid;place-items:center;cursor:pointer}
.lcd-ib:hover{background:rgba(0,0,0,.07)}
.lcd-ib svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.lcd-ib svg.f{fill:currentColor;stroke:none}
.lcd-body{flex:1;overflow-y:auto}
.lcd-wrap{max-width:900px;margin:0 auto;padding:28px 16px 48px}
.lcd-list{display:flex;flex-direction:column}
.lcd-row{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:16px;min-height:68px;padding:10px 18px;border-radius:10px;cursor:pointer;
  border-bottom:1px solid var(--lcd-line)}
.lcd-row.on{background:linear-gradient(var(--lcd-sel1),var(--lcd-sel2));color:var(--lcd-on);border-bottom-color:transparent}
.lcd-row:focus-visible{outline:2px solid var(--lcd-sel2);outline-offset:2px}
.lcd-row .t{display:flex;flex-direction:column;min-width:0;flex:1}
.lcd-row .l{font-size:20px;font-weight:600;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lcd-row small{font-size:15.5px;font-weight:500;color:var(--lcd-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lcd-row .m{font-family:var(--mono);font-size:15.5px;color:var(--lcd-muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.lcd-row.on small,.lcd-row.on .m{color:var(--lcd-on);opacity:.88}
.lcd-row .chev{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;opacity:.6}
.lcd-row .thumb{width:46px;height:46px;font-size:16px;border-radius:8px}
.lcd-row .acts{display:flex;gap:8px}
.lcd-pill{font:inherit;font-size:14px;font-weight:600;padding:7px 14px;border-radius:999px;border:1px solid var(--lcd-line);background:var(--lcd-bg);color:var(--lcd-fg);cursor:pointer;text-decoration:none;white-space:nowrap}
.lcd-now{display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr);gap:44px;align-items:start}
.lcd-player{display:flex;flex-direction:column;gap:14px;min-width:0}
.lcd-player .art{font-size:88px}
.lcd-seek{padding-block:8px;cursor:pointer}

  }
}

  --glass-bg:rgba(30,34,42,.46); --glass-bg-strong:rgba(26,29,36,.70); --glass-hover:rgba(255,255,255,.06);

function audioReady(){
  if(!soundOn) return null;
  try{
    if(!actx){
      const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return null;
      actx=new AC();
      const len=Math.floor(actx.sampleRate*0.03); clickBuf=actx.createBuffer(1,len,actx.sampleRate);
      const d=clickBuf.getChannelData(0); for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,7);
    }
    if(actx.state==='suspended') actx.resume();
  }catch(e){ return null; }
  return actx;
}
function click(kind){
  if(!soundOn) return;
  const press = kind==='press';
  const a=audioReady();
  if(a && a.state==='running' && clickBuf){
    try{
      const src=a.createBufferSource(); src.buffer=clickBuf;
      const bp=a.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=press?2300:3900; bp.Q.value=1.1;
      const gn=a.createGain(); gn.gain.value=press?0.55:0.35;
      src.connect(bp); bp.connect(gn); gn.connect(a.destination); src.start();
    }catch(e){}
  }
  if(navigator.vibrate){ try{ navigator.vibrate(press?12:5); }catch(e){} }
}

async function sendMessage(form, status, btn){
  const fd=new FormData(form);
  if(fd.get('_honey')) return;
  const name=String(fd.get('name')||'').trim(), email=String(fd.get('email')||'').trim(), message=String(fd.get('message')||'').trim();
  const bad = !name ? '이름을 적어 주세요.' : !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email) ? '답장 받을 이메일 주소를 확인해 주세요.' : !message ? '내용을 적어 주세요.' : '';
  status.className='cf-status';
  if(bad){ status.textContent=bad; status.classList.add('err'); return; }
  btn.disabled=true; btn.textContent='보내는 중…'; status.textContent='';
  try{
    const r=await fetch(CONTACT_ENDPOINT,{method:'POST', headers:{'Content-Type':'application/json', 'Accept':'application/json'},
      body:JSON.stringify({name, email, message, _replyto:email, _subject:'[포트폴리오] '+name+'님의 메시지', _template:'table'})});
    const j=await r.json().catch(()=>({}));
    if(!r.ok || j.success===false || j.success==='false') throw new Error(j.message||String(r.status));
    form.reset(); status.textContent='보냈어요. 확인하고 답장드릴게요.'; status.classList.add('ok');
  }catch(err){
    status.textContent='보내지 못했어요. 잠시 후 다시 시도하거나 '+CONTACT_TO+' 로 직접 보내 주세요.'; status.classList.add('err');
  }finally{ btn.disabled=false; btn.textContent='보내기'; }
}

  box.addEventListener('pointermove',e=>{

    while(drag.acc>=step){ cfStep(-1); drag.acc-=step; }

function rrShape(w,hh,r,seg){

function smoothNormals(geo, deg){
  const pos=geo.attributes.position, nor=geo.attributes.normal, n=pos.count, lim=Math.cos(deg*Math.PI/180);
  const groups=new Map();
  for(let i=0;i<n;i++){
    const k=Math.round(pos.getX(i)*1e4)+'_'+Math.round(pos.getY(i)*1e4)+'_'+Math.round(pos.getZ(i)*1e4);

  const out=new Float32Array(n*3), a=new T.Vector3(), b=new T.Vector3(), sum=new T.Vector3();

    for(const i of idx){

  const words=text.split(' '), out=[]; let line='';
  for(const w of words){ const tryL=line?line+' '+w:w; if(g.measureText(tryL).width<=max) line=tryL; else { if(line) out.push(line); line=w; } }
  if(line) out.push(line);

const BCOLS=8, BROWS=5, BGAP=6, BW=(SW-32-(BCOLS-1)*BGAP)/BCOLS, BH=22, BTOP=HEAD+56, PY=SH-30, PH=12, BALL=8;

function brickLevel(){
  BR.bricks=[]; for(let r=0;r<BROWS;r++) for(let c=0;c<BCOLS;c++) BR.bricks.push({x:16+c*(BW+BGAP), y:BTOP+r*(BH+BGAP), r, alive:true});

}

function brickEnter(){ if(!BR.bricks.length || BR.state==='over') brickNew(); }
function brickLeave(){ if(BR.state==='play') BR.state='pause'; }
function brickPause(){ if(BR.state==='play') BR.state='pause'; else if(BR.state==='pause') BR.state='play'; dirty=true; }
function stickBall(){ BR.bx=BR.px; BR.by=PY-PH/2-BALL-1; BR.vx=0; BR.vy=0; }
function saveBest(){ if(BR.score>BR.best){ BR.best=BR.score; try{ localStorage.setItem('ksg-brick-best',String(BR.best)); }catch(e){} } }
function brickAction(){
  if(BR.state==='ready'){ const sp=380*(1+0.12*(BR.level-1)), a=(-60-Math.random()*60)*Math.PI/180; BR.vx=Math.cos(a)*sp; BR.vy=Math.sin(a)*sp; BR.state='play'; }
  else if(BR.state==='play'||BR.state==='pause') brickPause();
  else if(BR.state==='over') brickNew();
  else if(BR.state==='win'){ BR.level++; brickLevel(); }
  dirty=true;
}
function brickSetX(x){ BR.px=Math.max(BR.pw/2, Math.min(SW-BR.pw/2, x)); if(BR.state==='ready') stickBall(); dirty=true; }
function brickMove(d){ brickSetX(BR.px+d*46); }
function brickUpdate(dt){
  if(BR.state!=='play') return;
  const steps=Math.max(1,Math.ceil(dt*Math.hypot(BR.vx,BR.vy)/5)), h=dt/steps;
  for(let i=0;i<steps;i++){
    BR.bx+=BR.vx*h; BR.by+=BR.vy*h;
    if(BR.bx<BALL){ BR.bx=BALL; BR.vx=Math.abs(BR.vx); }
    if(BR.bx>SW-BALL){ BR.bx=SW-BALL; BR.vx=-Math.abs(BR.vx); }
    if(BR.by<HEAD+BALL){ BR.by=HEAD+BALL; BR.vy=Math.abs(BR.vy); }
    if(BR.vy>0 && BR.by+BALL>=PY-PH/2 && BR.by<PY+PH/2 && Math.abs(BR.bx-BR.px)<=BR.pw/2+BALL){
      let off=Math.max(-1,Math.min(1,(BR.bx-BR.px)/(BR.pw/2)));
      if(Math.abs(off)<0.22) off=(off<0||(off===0&&BR.vx<0)?-1:1)*0.22;   // 정중앙에 맞아도 수직으로만 오가지 않게
      const sp=Math.hypot(BR.vx,BR.vy), ang=(-90+off*60+(Math.random()-0.5)*6)*Math.PI/180;
      BR.vx=Math.cos(ang)*sp; BR.vy=Math.sin(ang)*sp; BR.by=PY-PH/2-BALL; click('tick');
    }
    for(const b of BR.bricks){
      if(!b.alive) continue;
      const cx=Math.max(b.x,Math.min(BR.bx,b.x+BW)), cy=Math.max(b.y,Math.min(BR.by,b.y+BH)), dx=BR.bx-cx, dy=BR.by-cy;
      if(dx*dx+dy*dy<=BALL*BALL){
        b.alive=false; BR.score+=10*BR.level; click('press');
        if(Math.abs(dx)>Math.abs(dy)) BR.vx=-BR.vx; else BR.vy=-BR.vy;
        BR.vx*=1.01; BR.vy*=1.01;
        break;
      }
    }
    if(BR.by>SH+BALL){ BR.lives--; if(BR.lives<=0){ BR.state='over'; saveBest(); } else { BR.state='ready'; stickBall(); } return; }
    if(BR.bricks.every(b=>!b.alive)){ BR.state='win'; saveBest(); stickBall(); return; }
  }
}

  const BG='#0B0C0E'; g.fillStyle=BG; g.fillRect(0,HEAD,SW,SH-HEAD);
  const pos = s.cfPos==null ? s.sel : s.cfPos, CX=SW/2, CY=HEAD+138, S0=196;
  const order=list.map((it,k)=>({it,o:k-pos})).filter(e=>Math.abs(e.o)<3.4).sort((a,b)=>Math.abs(b.o)-Math.abs(a.o));
  for(const {it,o} of order){
    const a=Math.min(1,Math.abs(o)), ab=Math.abs(o), side=o<0?-1:1;
    const w=S0*(1-0.58*a), hN=S0*(1-0.1*a), hF=S0*(1-0.34*a);
    const cx = ab<=1 ? CX+o*158 : CX+side*(158+(ab-1)*58);
    trapDraw(artCanvas(it.idx), cx-w/2, cx+w/2, o>0?hN:hF, o>0?hF:hN, CY, 0.42*a);
  }
  const fy=CY+S0/2, fg=g.createLinearGradient(0,fy,0,fy+80); fg.addColorStop(0,'rgba(11,12,14,0)'); fg.addColorStop(1,BG);
  g.fillStyle=fg; g.fillRect(0,fy,SW,SH-fy);
  const pj=projects[list[s.sel].idx];
  g.textAlign='center'; g.textBaseline='middle';
  g.fillStyle='#FFFFFF'; g.font='700 30px '+FONT; g.fillText(fit(pj.title,SW-60),SW/2,SH-64);
  g.fillStyle='#A9B0BA'; g.font='500 22px '+FONT; g.fillText(fit([pj.period].concat(pj.lang).join(' · '),SW-60),SW/2,SH-30);
}
function drawBoot(){
  g.fillStyle='#000000'; g.fillRect(0,0,SW,SH);
  const a=Math.min(1,Math.max(0,(bootT-0.2)/0.5));
  g.globalAlpha=a; g.textAlign='center'; g.textBaseline='middle';
  g.fillStyle='#FFFFFF'; g.font='700 96px "Familjen Grotesk", '+FONT; g.fillText('KSG',SW/2,SH/2-40);
  g.fillStyle='rgba(255,255,255,.6)'; g.font='500 24px '+FONT; g.fillText('Portfolio',SW/2,SH/2+22);
  const pw=240, px=SW/2-pw/2, py=SH/2+80, f=Math.min(1,Math.max(0,(bootT-0.45)/(BOOT_LEN-0.85)));
  rr(px,py,pw,10,5); g.fillStyle='rgba(255,255,255,.18)'; g.fill();
  if(f>0){ g.save(); rr(px,py,pw,10,5); g.clip(); g.fillStyle='#FFFFFF'; g.fillRect(px,py,pw*f,10); g.restore(); }
  g.globalAlpha=1;
}
function drawScreen(){
  const s=topS();
  if(booting && bootT < BOOT_LEN-0.35){ drawBoot(); screenTex.needsUpdate=true; dirty=false; return; }
  header(s.arg || titles[s.id]);
  const list=items(s);
  if(list && isCF(s)) drawCoverFlow(list,s);
  else if(list) drawList(list,s); else if(s.id==='now') drawNow(); else if(s.id==='mail') drawMail(); else if(s.id==='brick') drawBrick(); else drawAbout();
  const gl=g.createLinearGradient(0,0,SW*0.6,SH); gl.addColorStop(0,'rgba(255,255,255,.16)'); gl.addColorStop(0.45,'rgba(255,255,255,0)');
  g.fillStyle=gl; g.fillRect(0,0,SW,SH);
  if(booting){ g.fillStyle='rgba(0,0,0,'+Math.max(0,1-(bootT-(BOOT_LEN-0.35))/0.35).toFixed(3)+')'; g.fillRect(0,0,SW,SH); }
  screenTex.needsUpdate=true; dirty=false;
}
if(document.fonts){ Promise.all([
  document.fonts.load('600 26px "IBM Plex Sans KR"','가나다'), document.fonts.load('500 20px "IBM Plex Mono"'),
  document.fonts.load('700 40px "Familjen Grotesk"'), document.fonts.load('700 40px "IBM Plex Sans KR"','MENU')
 ]).then(()=>{ drawEngrave(); for(const k in artCache) delete artCache[k]; for(const k in artURLs) delete artURLs[k]; dirty=true; applyTheme(); }).catch(()=>{}); }

/* ---------- input ---------- */
const ray=new T.Raycaster(), ndc=new T.Vector2(), ptr={x:0,y:0}, ptrS={x:0,y:0};
const _n=new T.Vector3(), _p=new T.Vector3(), _q=new T.Quaternion(), _hit=new T.Vector3(), plane=new T.Plane();
function wheelLocal(e){
  const r=canvas.getBoundingClientRect();
  ndc.set(((e.clientX-r.left)/r.width)*2-1, -((e.clientY-r.top)/r.height)*2+1);
  ray.setFromCamera(ndc,camera); wheelGroup.updateWorldMatrix(true,false);
  _n.set(0,0,1).applyQuaternion(wheelGroup.getWorldQuaternion(_q));
  plane.setFromNormalAndCoplanarPoint(_n, wheelGroup.getWorldPosition(_p));
  if(!ray.ray.intersectPlane(plane,_hit)) return null;
  const l=wheelGroup.worldToLocal(_hit);
  return {r:Math.hypot(l.x,l.y), a:Math.atan2(l.y,l.x)};
}
function onFsIcon(e){
  const r=canvas.getBoundingClientRect();
  ndc.set(((e.clientX-r.left)/r.width)*2-1, -((e.clientY-r.top)/r.height)*2+1);
  ray.setFromCamera(ndc,camera);
  const hit=ray.intersectObject(screen,false)[0];
  if(!hit || !hit.uv) return false;
  return hit.uv.x*SW >= FSX0-10 && (1-hit.uv.y)*SH <= HEAD+8;
}
let mode=null, lastA=0, downA=0, acc=0, travel=0, lastX=0, lastY=0, dragYaw=0, dragPitch=0, wheelAcc=0;
const press={center:0, tx:0, ty:0, dot:0, dotA:0};
canvas.addEventListener('pointerdown',e=>{
  audioReady();
  if(booting) bootT=Math.max(bootT,BOOT_LEN-0.35);   // 누르면 부팅 건너뛰기
  if(onFsIcon(e)){ mode='fs'; try{ canvas.setPointerCapture(e.pointerId); }catch(err){} return; }
  const w=wheelLocal(e);
  if(w && w.r<RC){ mode='center'; press.center=1; }
  else if(w && w.r<R+0.02){ mode='wheel'; lastA=downA=w.a; acc=0; travel=0; press.dot=1; press.dotA=w.a; }
  else { mode='orbit'; lastX=e.clientX; lastY=e.clientY; canvas.style.cursor='grabbing'; }
  try{ canvas.setPointerCapture(e.pointerId); }catch(err){}
  stage.focus({preventScroll:true});
});
canvas.addEventListener('pointermove',e=>{
  if(!mode){ const r=canvas.getBoundingClientRect(); ptr.x=((e.clientX-r.left)/r.width)*2-1; ptr.y=((e.clientY-r.top)/r.height)*2-1; }
  if(mode==='wheel'){
    const w=wheelLocal(e); if(!w) return;
    let d=w.a-lastA; if(d>Math.PI) d-=Math.PI*2; if(d<-Math.PI) d+=Math.PI*2;
    lastA=w.a; acc+=d; travel+=Math.abs(d); press.dotA=w.a;
    const step=Math.PI/8;
    while(acc<=-step){ scroll(1); acc+=step; }
    while(acc>=step){ scroll(-1); acc-=step; }
  } else if(mode==='orbit'){
    dragYaw+=(e.clientX-lastX)*0.009; dragPitch=Math.max(-0.6,Math.min(0.6,dragPitch+(e.clientY-lastY)*0.006));
    lastX=e.clientX; lastY=e.clientY;
  } else if(e.pointerType==='mouse' && !mode){
    const over=onFsIcon(e); if(over!==fsHover){ fsHover=over; dirty=true; }
    const w=wheelLocal(e); canvas.style.cursor = over || (w && w.r<R) ? 'pointer' : 'grab';
  }
});
function endPointer(e){
  if(mode==='fs'){ mode=null; if(onFsIcon(e)) openLcd(); return; }
  if(mode==='center'){ press.center=0; select(); }
  else if(mode==='wheel' && travel<0.3){
    if(!booting) click('press');
    const deg=downA*180/Math.PI;
    if(deg>45&&deg<135){ press.ty=-1; back(); }
    else if(deg<-45&&deg>-135){ press.ty=1; togglePlay(); }
    else if(Math.abs(deg)>=135){ press.tx=-1; prev(); }
    else { press.tx=1; next(); }
  }
  if(mode==='orbit') canvas.style.cursor='grab';
  press.dot=0; mode=null;
}
canvas.addEventListener('pointerup',endPointer);
canvas.addEventListener('pointercancel',()=>{ press.center=0; press.dot=0; mode=null; });
canvas.addEventListener('pointerleave',()=>{ if(!mode){ ptr.x=0; ptr.y=0; } if(fsHover){ fsHover=false; dirty=true; } });
canvas.addEventListener('wheel',e=>{
  const w=wheelLocal(e); if(!w || w.r>R+0.3) return;
  e.preventDefault(); wheelAcc+=e.deltaY;
  while(wheelAcc>50){ scroll(1); wheelAcc-=50; }
  while(wheelAcc<-50){ scroll(-1); wheelAcc+=50; }
},{passive:false});
stage.addEventListener('keydown',e=>{
  audioReady();
  if(booting) bootT=Math.max(bootT,BOOT_LEN-0.35);
  const k=e.key; let handled=true;
  if(topS().id==='brick' && !booting){
    if(k==='ArrowLeft') brickMove(-1); else if(k==='ArrowRight') brickMove(1);
    else if(k==='Enter'||k===' '){ press.center=1; setTimeout(()=>press.center=0,120); brickAction(); }
    else if(k==='Escape'||k==='Backspace'){ press.ty=-1; back(); }
    else if(k==='f'||k==='F') openLcd();
    else handled=false;
    if(handled) e.preventDefault();
    return;
  }
  if(k==='ArrowDown') scroll(1); else if(k==='ArrowUp') scroll(-1);
  else if(k==='Enter'||k==='ArrowRight'){ press.center=1; setTimeout(()=>press.center=0,120); select(); }
  else if(k==='Escape'||k==='ArrowLeft'||k==='Backspace'){ press.ty=-1; back(); }
  else if(k===' '){ press.ty=1; togglePlay(); }
  else if(k==='f'||k==='F') openLcd();
  else handled=false;
  if(handled) e.preventDefault();
});

function resize(){
  const w=stage.clientWidth, hh=stage.clientHeight; if(!w||!hh) return;
  renderer.setSize(w,hh,false); camera.aspect=w/hh;
  const fitH=Math.max(5.9, 3.3/camera.aspect);   // 세로 5.9 또는 기기 가로 폭 기준
  camera.position.z=fitH/2/Math.tan(camera.fov*Math.PI/360);
  camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(stage); resize();
let visible=true;
new IntersectionObserver(es=>{ visible=es[0].isIntersecting; }).observe(stage);

/* ---------- loop ---------- */
let last=performance.now(), clock=0, introT=reduce?1:0, lastSec=-1, toastOn=false;
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min(0.05,(now-last)/1000); last=now;

  if(playing){
    elapsed+=dt;
    if(elapsed>=runtime(projects[current])) next();
    const sec=Math.floor(elapsed); if(sec!==lastSec){ lastSec=sec; if(topS().id==='now') dirty=true; }
  }
  const inBrick = topS().id==='brick' && !booting;
  if(inBrick && (visible||lcdOpen)){ brickUpdate(dt); dirty=true; }
  if(lcdOpen){
    if(inBrick && dirty) drawScreen();
    if(lcdKeyNow()!==lcdKey) renderLcd();
    lcdProgress();
    if((now<toastUntil)!==lcdToast) lcdTitleUpdate();
    return;
  }
  if(!visible) return;
  clock+=dt;
  if(booting){ bootT+=dt; if(bootT>=BOOT_LEN) booting=false; dirty=true; }
  const ts=topS();
  if(isCF(ts)){
    if(ts.cfPos==null) ts.cfPos=ts.sel;
    const d=ts.sel-ts.cfPos;
    if(Math.abs(d)>0.002){ ts.cfPos += reduce ? d : d*(1-Math.exp(-dt*11)); dirty=true; }
    else if(ts.cfPos!==ts.sel){ ts.cfPos=ts.sel; dirty=true; }
  }
  const amb=reduce?0:1;
  introT=Math.min(1,introT+dt/2.0); const e=1-Math.pow(1-introT,4);
  // 마우스를 부드럽게 따라가기만 하고, 제자리 흔들림·박자 튕김은 없음
  const k=1-Math.exp(-dt*4); ptrS.x+=(ptr.x-ptrS.x)*k; ptrS.y+=(ptr.y-ptrS.y)*k;
  if(mode!=='orbit'){ const d=Math.exp(-dt*3); dragYaw*=d; dragPitch*=d; }
  // 임계 감쇠 스프링: 돌았다가 튕기지 않고 그대로 제자리로
  spinVel += (-spin*40 - spinVel*12.65)*dt; spin += spinVel*dt;

  device.rotation.y = -(1-e)*Math.PI + ptrS.x*0.22*amb + dragYaw + spin*amb;
  device.rotation.x = ptrS.y*0.12*amb + dragPitch;
  device.rotation.z = 0;
  device.position.y = -(1-e)*0.9;
  shadow.scale.x = 1-device.position.y*0.15; shadow.material.opacity = 0.9-device.position.y*0.3;

  const pk=Math.min(1,dt*14);
  centerBtn.position.z += ((0.02-0.014*press.center)-centerBtn.position.z)*pk;
  wheelGroup.rotation.y += (press.tx*0.07-wheelGroup.rotation.y)*pk;
  wheelGroup.rotation.x += (-press.ty*0.07-wheelGroup.rotation.x)*pk;
  press.tx*=Math.pow(0.0005,dt); press.ty*=Math.pow(0.0005,dt);
  const dm=touchDot.material; dm.opacity += ((press.dot?0.12:0)-dm.opacity)*pk;
  const mr=(R+RC)/2; touchDot.position.x=Math.cos(press.dotA)*mr; touchDot.position.y=Math.sin(press.dotA)*mr;

  const tOn = now<toastUntil; if(tOn!==toastOn){ toastOn=tOn; dirty=true; }
  if(dirty) drawScreen();
  renderer.render(scene,camera);
}
drawScreen();
requestAnimationFrame(frame);
})();
</script>
